# Databricks Apps configuration.
#
# ASSUMPTION, NOT CONFIRMED AGAINST YOUR WORKSPACE: I have no network access
# from this environment to test against a real Databricks Apps deployment,
# and no sibling app.yaml from your org to match conventions against (see
# DEPLOYMENT.md). This follows Databricks' general documented convention for
# a Streamlit app: a minimal command with no hardcoded port/address (the
# platform injects and proxies these), and CORS/XSRF relaxed in
# .streamlit/config.toml (commonly required because Databricks Apps proxies
# the app through its own domain). Confirm this against an existing app in
# your workspace, or current Databricks documentation, before deploying.
command: ["streamlit", "run", "app.py"]
