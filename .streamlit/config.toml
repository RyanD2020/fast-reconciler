# Server settings for running behind the Databricks Apps proxy.
# enableCORS / enableXsrfProtection are set false because Databricks Apps
# serves the app through its own domain rather than directly -- strict
# CORS/XSRF checks can otherwise block the app from loading. This is a
# commonly documented Databricks Apps + Streamlit requirement, not verified
# against this specific workspace -- see DEPLOYMENT.md.
[server]
headless = true
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false

# NYL brand colors (see core/brand.py). Streamlit's [theme] only supports a
# single base font family ("sans serif" here, for body/UI text) -- the
# Georgia headline font and anything more granular is layered on top via
# core/ui.py::apply_brand_theme()'s CSS injection.
[theme]
primaryColor = "#000A62"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E3E0DD"
textColor = "#000A62"
font = "sans serif"
